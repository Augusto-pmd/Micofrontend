  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey: "AIzaSyDvlEk1cRr61Mls989BGuvNlogRHX30qAU",
      authDomain: "mc-nordelta-2026.firebaseapp.com",
      projectId: "mc-nordelta-2026",
      storageBucket: "mc-nordelta-2026.firebasestorage.app",
      messagingSenderId: "331447282240",
      appId: "1:331447282240:web:db79cca7e572bd6b3b8da5"
    });

    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window._fb = {
      signInWithGoogle: () => signInWithPopup(auth, provider),
      signInWithEmail: (email, password) => signInWithEmailAndPassword(auth, email, password),
      signOut: () => signOut(auth),
    };

    // Sincroniza sesión de Firebase con el store de la app
    onAuthStateChanged(auth, (user) => {
      const stored = JSON.parse(localStorage.getItem('mc.user') || 'null');
      if (user) {
        if (!stored || stored.uid !== user.uid) {
          localStorage.setItem('mc.user', JSON.stringify({
            uid: user.uid, email: user.email,
            name: user.displayName, picture: user.photoURL, provider: 'google',
          }));
          window.dispatchEvent(new Event('mc:user-change'));
        }
      } else {
        if (stored) {
          localStorage.removeItem('mc.user');
          window.dispatchEvent(new Event('mc:user-change'));
        }
      }
    });
  </script>

  <div class="mc-grain" aria-hidden="true"></div>
  <canvas id="mc-aurora-canvas" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;filter:blur(22px);"></canvas>
  <div id="root"></div>
  <script>
  (function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var cvs = document.getElementById('mc-aurora-canvas');
    var ctx  = cvs.getContext('2d');
    var W, H;

    function resize() {
      W = cvs.width  = window.innerWidth;
      H = cvs.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // alpha más bajos + violetBoost suave = colores naturales, no eléctricos
    var ribbons = [
      { yBase:0.07, amp:0.055, freq:0.0032, speed:0.00022, phase:0.0, thick:0.20, alpha:0.14, scrollShift:0.40, violetBoost:0.10, c1:[61,48,131],  c2:[94,202,0]   },
      { yBase:0.03, amp:0.040, freq:0.0025, speed:0.00016, phase:2.1, thick:0.14, alpha:0.11, scrollShift:0.60, violetBoost:0.05, c1:[94,202,0],   c2:[61,48,131]  },
      { yBase:0.18, amp:0.065, freq:0.0040, speed:0.00027, phase:4.0, thick:0.13, alpha:0.10, scrollShift:0.28, violetBoost:0.08, c1:[80,55,180],  c2:[40,195,115] },
      { yBase:0.22, amp:0.050, freq:0.0028, speed:0.00019, phase:1.4, thick:0.10, alpha:0.09, scrollShift:0.50, violetBoost:0.04, c1:[40,195,115], c2:[61,48,131]  },
      { yBase:0.12, amp:0.045, freq:0.0048, speed:0.00032, phase:5.5, thick:0.09, alpha:0.08, scrollShift:0.35, violetBoost:0.06, c1:[100,70,200], c2:[94,202,0]   },
    ];

    var scrollSmooth  = 0;
    var howProximity  = 0;  // 0 = lejos de la nube, 1 = centrada en pantalla
    var howEl         = document.getElementById('how');

    function rgba(c, a) { return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

    function drawRibbon(r, t, scrollP, vBoost) {
      var yShift   = scrollP * r.scrollShift;
      var thickMul = 1 + scrollP * 1.2;
      var y0    = H * (r.yBase + yShift);
      var amp   = H * r.amp;
      var thick = H * r.thick * thickMul;
      // Alpha aumenta según la proximidad a la nube × el boost propio de cada ribbon
      var a = r.alpha + r.violetBoost * vBoost;

      function topY(x) { return y0 + amp * Math.sin(x * r.freq + t * r.speed + r.phase); }
      function botY(x) { return y0 + thick + amp * 0.8 * Math.sin(x * r.freq + t * r.speed * 0.88 + r.phase + 0.35); }

      ctx.beginPath();
      for (var x = 0; x <= W; x += 3) {
        if (x === 0) ctx.moveTo(x, topY(x)); else ctx.lineTo(x, topY(x));
      }
      for (var x = W; x >= 0; x -= 3) { ctx.lineTo(x, botY(x)); }
      ctx.closePath();

      var g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0,    rgba(r.c1, 0));
      g.addColorStop(0.10, rgba(r.c1, a));
      g.addColorStop(0.38, rgba(r.c2, a));
      g.addColorStop(0.62, rgba(r.c1, a * 0.9));
      g.addColorStop(0.88, rgba(r.c2, a));
      g.addColorStop(1,    rgba(r.c1, 0));

      ctx.fillStyle = g;
      ctx.fill();
    }

    var raf = null;
    function draw() {
      var maxScroll = Math.max(1, document.body.scrollHeight - window.innerHeight);
      scrollSmooth += (window.scrollY / maxScroll - scrollSmooth) * 0.04;

      // Proximidad de la sección "Cómo funciona" al centro del viewport (0→1→0)
      if (howEl) {
        var rect   = howEl.getBoundingClientRect();
        var center = rect.top + rect.height / 2;
        var dist   = Math.abs(center - H / 2);
        var range  = H / 2 + rect.height / 2;
        var raw    = Math.max(0, 1 - dist / range);
        howProximity += (raw - howProximity) * 0.04;  // lerp suave
      }

      ctx.clearRect(0, 0, W, H);
      var t = performance.now();
      for (var i = 0; i < ribbons.length; i++) drawRibbon(ribbons[i], t, scrollSmooth, howProximity);
      raf = requestAnimationFrame(draw);
    }
    draw();

    // Pausa cuando el tab está oculto
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
      else if (!raf) draw();
    });
  })();
  </script>
