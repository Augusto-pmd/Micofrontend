  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey: "AIzaSyDvlEk1cRr61Mls989BGuvNlogRHX30qAU",
      authDomain: "mc-nordelta-2026.firebaseapp.com",
      projectId: "mc-nordelta-2026",
      storageBucket: "mc-nordelta-2026.firebasestorage.app",
      messagingSenderId: "331447282240",
      appId: "1:331447282240:web:db79cca7e572bd6b3b8da5"
    });

    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window._fb = {
      signInWithGoogle: () => signInWithPopup(auth, provider),
      signOut: () => signOut(auth),
    };

    // Sincroniza sesión de Firebase con el store de la app
    onAuthStateChanged(auth, (user) => {
      const stored = JSON.parse(localStorage.getItem('mc.user') || 'null');
      if (user) {
        if (!stored || stored.uid !== user.uid) {
          localStorage.setItem('mc.user', JSON.stringify({
            uid: user.uid, email: user.email,
            name: user.displayName, picture: user.photoURL, provider: 'google',
          }));
          window.dispatchEvent(new Event('mc:user-change'));
        }
      } else {
        if (stored) {
          localStorage.removeItem('mc.user');
          window.dispatchEvent(new Event('mc:user-change'));
        }
      }
    });
  </script>

  <div class="mc-grain" aria-hidden="true"></div>
  <canvas id="mc-aurora-canvas" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;filter:blur(55px);"></canvas>
  <div id="root"></div>
  <script>
  (function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var cvs = document.getElementById('mc-aurora-canvas');
    var ctx  = cvs.getContext('2d');
    var W, H;

    function resize() {
      W = cvs.width  = window.innerWidth;
      H = cvs.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Cintas anchas que cubren todo el fondo — no solo el encabezado
    var ribbons = [
      { yBase:0.00, amp:0.08, freq:0.0018, speed:0.00018, phase:0.0, thick:0.55, alpha:0.32, c1:[61,48,131],  c2:[94,202,0]   },
      { yBase:0.25, amp:0.10, freq:0.0014, speed:0.00013, phase:2.1, thick:0.60, alpha:0.28, c1:[94,202,0],   c2:[80,55,180]  },
      { yBase:0.50, amp:0.09, freq:0.0020, speed:0.00020, phase:4.0, thick:0.50, alpha:0.24, c1:[80,55,180],  c2:[40,195,115] },
      { yBase:0.70, amp:0.07, freq:0.0016, speed:0.00015, phase:1.4, thick:0.45, alpha:0.22, c1:[40,195,115], c2:[61,48,131]  },
      { yBase:0.10, amp:0.12, freq:0.0012, speed:0.00010, phase:5.5, thick:0.65, alpha:0.20, c1:[100,70,200], c2:[94,202,0]   },
    ];

    function rgba(c, a) { return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

    function drawRibbon(r, t) {
      var y0    = H * r.yBase;
      var amp   = H * r.amp;
      var thick = H * r.thick;

      // borde superior
      function topY(x) { return y0 + amp * Math.sin(x * r.freq + t * r.speed + r.phase); }
      // borde inferior: misma onda ligeramente desplazada + grosor
      function botY(x) { return y0 + thick + amp * 0.8 * Math.sin(x * r.freq + t * r.speed * 0.88 + r.phase + 0.35); }

      ctx.beginPath();
      for (var x = 0; x <= W; x += 3) {
        if (x === 0) ctx.moveTo(x, topY(x)); else ctx.lineTo(x, topY(x));
      }
      for (var x = W; x >= 0; x -= 3) { ctx.lineTo(x, botY(x)); }
      ctx.closePath();

      // Gradiente horizontal: color1 → color2 → color1, fade en los bordes
      var g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0,    rgba(r.c1, 0));
      g.addColorStop(0.10, rgba(r.c1, r.alpha));
      g.addColorStop(0.38, rgba(r.c2, r.alpha));
      g.addColorStop(0.62, rgba(r.c1, r.alpha * 0.9));
      g.addColorStop(0.88, rgba(r.c2, r.alpha));
      g.addColorStop(1,    rgba(r.c1, 0));

      ctx.fillStyle = g;
      ctx.fill();
    }

    var raf = null;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      var t = performance.now();
      for (var i = 0; i < ribbons.length; i++) drawRibbon(ribbons[i], t);
      raf = requestAnimationFrame(draw);
    }
    draw();

    // Pausa cuando el tab está oculto
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
      else if (!raf) draw();
    });
  })();
  </script>
