<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mi Container — Home Redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=4" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overflow: hidden; height: 100%; font-family: 'Montserrat', system-ui, sans-serif; }
  .frame-shell {
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 20px 60px -20px rgba(0,0,0,0.15);
    position: relative;
  }
  .frame-desktop { width: 1440px; height: 2800px; }
  .frame-mobile  { width: 390px; height: 2800px; }
  .frame-scroll {
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin;
  }
  .frame-label {
    position: absolute; bottom: 100%; left: 0; padding-bottom: 10px;
    font-size: 12px; font-weight: 600; color: rgba(60,50,40,0.7);
    display: flex; gap: 10px; align-items: center;
    font-family: 'Montserrat', system-ui, sans-serif;
  }
  .frame-label b { color: rgba(40,30,20,0.9); }
  .frame-label .dim { color: rgba(60,50,40,0.5); font-weight: 500; font-family: 'JetBrains Mono', monospace; font-size: 11px; }

  /* Tweaks panel */
  #tweaks-panel {
    position: fixed; bottom: 20px; right: 20px; z-index: 10000;
    background: #141212; color: white; border-radius: 14px;
    padding: 18px; width: 280px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.5);
    font-family: 'Montserrat', sans-serif;
    display: none;
  }
  #tweaks-panel.open { display: block; }
  #tweaks-panel h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
    color: rgba(255,255,255,0.5); margin: 0 0 14px; font-weight: 700;
  }
  .tw-row { margin-bottom: 14px; }
  .tw-row label {
    display: block; font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.6); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .tw-seg {
    display: flex; background: rgba(255,255,255,0.06); border-radius: 8px;
    padding: 3px; gap: 2px;
  }
  .tw-seg button {
    flex: 1; padding: 8px 4px; font-size: 12px; font-weight: 600;
    background: transparent; color: rgba(255,255,255,0.65); border: none;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    text-transform: capitalize;
    transition: all 0.15s;
  }
  .tw-seg button:hover { color: white; }
  .tw-seg button.active { background: #5eca00; color: white; }
  .tw-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; background: rgba(255,255,255,0.06); border-radius: 8px; font-size: 13px; font-weight: 500; }
  .tw-toggle input { accent-color: #5eca00; width: 34px; height: 20px; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <rect width="400" height="400" fill="#e8f7d1"/>
      <g transform="translate(120, 120)">
        <rect x="0" y="40" width="160" height="100" rx="8" fill="none" stroke="#1a1727" stroke-width="10"/>
        <path d="M0 70 H160 M55 40 V140 M105 40 V140" stroke="#1a1727" stroke-width="10"/>
        <circle cx="140" cy="20" r="14" fill="#5eca00"/>
      </g>
      <text x="200" y="320" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="28" fill="#1a1727">mi<tspan font-weight="500">container</tspan></text>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>

  <script>
    // Edit-mode defaults — root-file JSON block so the host can persist
    window.__TWEAKS = /*EDITMODE-BEGIN*/{
      "primary": "green",
      "density": "compact",
      "radius": "rounded",
      "heroImage": true,
      "marquee": true
    }/*EDITMODE-END*/;
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Frame({ scope, tweaks, label, dim }) {
      return (
        <div style={{ position: 'relative' }}>
          <div className="frame-label">
            <b>{label}</b>
            <span className="dim">{dim}</span>
          </div>
          <div className={`frame-shell frame-${scope}`}>
            <div className="frame-scroll">
              <MiContainerHome tweaks={tweaks} scope={scope} />
            </div>
          </div>
        </div>
      );
    }

    function TweaksPanel({ tweaks, setTweaks, visible }) {
      const update = (key, val) => {
        const next = { ...tweaks, [key]: val };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
      };
      return (
        <div id="tweaks-panel" className={visible ? 'open' : ''}>
          <h4>Tweaks</h4>

          <div className="tw-row">
            <label>Primary color</label>
            <div className="tw-seg">
              <button className={tweaks.primary === 'green' ? 'active' : ''} onClick={() => update('primary', 'green')}>Green</button>
              <button className={tweaks.primary === 'violet' ? 'active' : ''} onClick={() => update('primary', 'violet')}>Violet</button>
            </div>
          </div>

          <div className="tw-row">
            <label>Density</label>
            <div className="tw-seg">
              <button className={tweaks.density === 'compact' ? 'active' : ''} onClick={() => update('density', 'compact')}>Compact</button>
              <button className={tweaks.density === 'comfortable' ? 'active' : ''} onClick={() => update('density', 'comfortable')}>Comfy</button>
              <button className={tweaks.density === 'spacious' ? 'active' : ''} onClick={() => update('density', 'spacious')}>Spacious</button>
            </div>
          </div>

          <div className="tw-row">
            <label>Border radius</label>
            <div className="tw-seg">
              <button className={tweaks.radius === 'sharp' ? 'active' : ''} onClick={() => update('radius', 'sharp')}>Sharp</button>
              <button className={tweaks.radius === 'rounded' ? 'active' : ''} onClick={() => update('radius', 'rounded')}>Rounded</button>
              <button className={tweaks.radius === 'pill' ? 'active' : ''} onClick={() => update('radius', 'pill')}>Pill</button>
            </div>
          </div>

          <div className="tw-row">
            <label style={{ marginBottom: 8 }}>Marquee strip</label>
            <label className="tw-toggle">
              <span>Show scrolling marquee</span>
              <input type="checkbox" checked={tweaks.marquee} onChange={(e) => update('marquee', e.target.checked)} />
            </label>
          </div>
        </div>
      );
    }

    function App() {
      const [tweaks, setTweaks] = useState(window.__TWEAKS);
      const [tweaksOpen, setTweaksOpen] = useState(false);

      useEffect(() => {
        const handler = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
        };
        window.addEventListener('message', handler);
        // Announce availability AFTER the listener is attached
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      return (
        <>
          <DesignCanvas>
            <DCSection
              title="Mi Container — editorial redesign"
              subtitle="No calculator · oversized display type · serif italic accents · floating pill nav · marquee · dark how-it-works · 2-up case study · stat-led hero · brutalist big CTA"
              gap={120}
            >
              <div style={{ position: 'relative', paddingTop: 32 }}>
                <Frame scope="desktop" tweaks={tweaks} label="Desktop" dim="1440 × scroll" />
              </div>
              <div style={{ position: 'relative', paddingTop: 32 }}>
                <Frame scope="mobile" tweaks={tweaks} label="Mobile" dim="390 × scroll" />
              </div>

              <DCPostIt top={60} left={-20} rotate={-3} width={220}>
                Calculadora eliminada · hero editorial con tipografía gigante, serif italic accents y pill flotante.
              </DCPostIt>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksOpen} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
