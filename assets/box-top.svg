<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Corrugación vertical -->
    <pattern id="cv" width="18" height="18" patternUnits="userSpaceOnUse">
      <line x1="9" y1="0" x2="9" y2="18" stroke="rgba(90,45,10,0.11)" stroke-width="1.2"/>
    </pattern>
    <!-- Corrugación horizontal -->
    <pattern id="ch" width="18" height="18" patternUnits="userSpaceOnUse">
      <line x1="0" y1="9" x2="18" y2="9" stroke="rgba(90,45,10,0.11)" stroke-width="1.2"/>
    </pattern>

    <!-- Tapas: gradiente de iluminación superior -->
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d4a0"/>
      <stop offset="100%" stop-color="#d4a060"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#e8c88a"/>
      <stop offset="100%" stop-color="#c89050"/>
    </linearGradient>
    <linearGradient id="gl" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#d4a060"/>
      <stop offset="100%" stop-color="#b87838"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a060"/>
      <stop offset="100%" stop-color="#b87838"/>
    </linearGradient>

    <!-- Paredes interiores -->
    <linearGradient id="wt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6a3010"/>
      <stop offset="100%" stop-color="#a86030"/>
    </linearGradient>
    <linearGradient id="wb" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#8a4820"/>
      <stop offset="100%" stop-color="#b87040"/>
    </linearGradient>
    <linearGradient id="wl" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#582808"/>
      <stop offset="100%" stop-color="#905028"/>
    </linearGradient>
    <linearGradient id="wr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#582808"/>
      <stop offset="100%" stop-color="#905028"/>
    </linearGradient>

    <!-- Piso interior -->
    <radialGradient id="floor" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#daa868"/>
      <stop offset="100%" stop-color="#c89050"/>
    </radialGradient>

    <!-- Sombra ambiental en el piso -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="rgba(70,30,5,0)"  />
      <stop offset="100%" stop-color="rgba(70,30,5,0.22)"/>
    </radialGradient>
  </defs>

  <!-- ══ TAPAS ══════════════════════════════════════════════════════ -->

  <!-- Tapa superior -->
  <polygon points="0,0 1200,0 1010,148 190,148" fill="url(#gt)"/>
  <polygon points="0,0 1200,0 1010,148 190,148" fill="url(#cv)" opacity="0.55"/>

  <!-- Tapa inferior -->
  <polygon points="0,700 1200,700 1010,552 190,552" fill="url(#gb)"/>
  <polygon points="0,700 1200,700 1010,552 190,552" fill="url(#cv)" opacity="0.55"/>

  <!-- Tapa izquierda -->
  <polygon points="0,0 0,700 190,552 190,148" fill="url(#gl)"/>
  <polygon points="0,0 0,700 190,552 190,148" fill="url(#ch)" opacity="0.55"/>

  <!-- Tapa derecha -->
  <polygon points="1200,0 1200,700 1010,552 1010,148" fill="url(#gr)"/>
  <polygon points="1200,0 1200,700 1010,552 1010,148" fill="url(#ch)" opacity="0.55"/>

  <!-- ══ PAREDES INTERIORES (franjas de profundidad) ════════════════ -->

  <!-- Pared superior -->
  <polygon points="190,148 1010,148 985,178 215,178" fill="url(#wt)"/>
  <!-- Pared inferior -->
  <polygon points="190,552 1010,552 985,522 215,522" fill="url(#wb)"/>
  <!-- Pared izquierda -->
  <polygon points="190,148 190,552 220,522 220,178" fill="url(#wl)"/>
  <!-- Pared derecha -->
  <polygon points="1010,148 1010,552 980,522 980,178" fill="url(#wr)"/>

  <!-- ══ PISO INTERIOR ══════════════════════════════════════════════ -->
  <rect x="215" y="178" width="770" height="344" fill="url(#floor)"/>
  <rect x="215" y="178" width="770" height="344" fill="url(#cv)" opacity="0.30"/>
  <rect x="215" y="178" width="770" height="344" fill="url(#floorShadow)"/>

  <!-- ══ LÍNEAS DE PLIEGUE ══════════════════════════════════════════ -->
  <!-- Diagonales de esquina -->
  <line x1="190" y1="148" x2="0"    y2="0"   stroke="#7a3a12" stroke-width="1.5" opacity="0.75"/>
  <line x1="1010" y1="148" x2="1200" y2="0"   stroke="#7a3a12" stroke-width="1.5" opacity="0.75"/>
  <line x1="190" y1="552" x2="0"    y2="700"  stroke="#7a3a12" stroke-width="1.5" opacity="0.75"/>
  <line x1="1010" y1="552" x2="1200" y2="700"  stroke="#7a3a12" stroke-width="1.5" opacity="0.75"/>

  <!-- Marco interior de la apertura -->
  <rect x="190" y="148" width="820" height="404" fill="none"
        stroke="#8a4820" stroke-width="2.5" opacity="0.90"/>
</svg>
