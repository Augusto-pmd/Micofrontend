<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Corrugación vertical (izq/der en el interior) -->
    <pattern id="cv" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="8" y1="0" x2="8" y2="16" stroke="rgba(90,45,10,0.10)" stroke-width="1.1"/>
    </pattern>
    <!-- Corrugación horizontal (tapa/fondo) -->
    <pattern id="ch" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="16" y2="8" stroke="rgba(90,45,10,0.10)" stroke-width="1.1"/>
    </pattern>

    <!-- Pared izquierda: oscuro al fondo -->
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3a1a06"/>
      <stop offset="100%" stop-color="#7a4018"/>
    </linearGradient>
    <!-- Pared derecha: oscuro al fondo -->
    <linearGradient id="gr" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#3a1a06"/>
      <stop offset="100%" stop-color="#7a4018"/>
    </linearGradient>
    <!-- Tapa superior (cara interior visible, iluminada) -->
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8c88a"/>
      <stop offset="100%" stop-color="#c8904e"/>
    </linearGradient>
    <!-- Tapa inferior (cara exterior) -->
    <linearGradient id="gb" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#d4a462"/>
      <stop offset="100%" stop-color="#c08848"/>
    </linearGradient>
    <!-- Pared superior interna (techo interior de la caja) -->
    <linearGradient id="gti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a2c0a"/>
      <stop offset="100%" stop-color="#9a5828"/>
    </linearGradient>
    <!-- Piso interior de la caja -->
    <linearGradient id="gfi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7a4018"/>
      <stop offset="100%" stop-color="#b07030"/>
    </linearGradient>

    <!-- Pared trasera (donde va el contenido) -->
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c89060"/>
      <stop offset="100%" stop-color="#ba8050"/>
    </linearGradient>

    <!-- Sombra ambiental interior -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="55%">
      <stop offset="40%"  stop-color="rgba(60,25,5,0)"/>
      <stop offset="100%" stop-color="rgba(60,25,5,0.28)"/>
    </radialGradient>
  </defs>

  <!-- ══ PAREDES LATERALES INTERIORES (perspectiva) ════════════════ -->

  <!-- Pared izquierda: trapecio de la esquina exterior al borde de apertura -->
  <polygon points="0,0 0,860 148,712 148,148" fill="url(#gl)"/>
  <polygon points="0,0 0,860 148,712 148,148" fill="url(#ch)" opacity="0.45"/>

  <!-- Pared derecha -->
  <polygon points="1200,0 1200,860 1052,712 1052,148" fill="url(#gr)"/>
  <polygon points="1200,0 1200,860 1052,712 1052,148" fill="url(#ch)" opacity="0.45"/>

  <!-- ══ TAPA SUPERIOR ABIERTA (cara interior visible) ═════════════ -->
  <polygon points="0,0 1200,0 1052,148 148,148" fill="url(#gt)"/>
  <polygon points="0,0 1200,0 1052,148 148,148" fill="url(#cv)" opacity="0.50"/>

  <!-- Borde corrugado de la apertura (canto del cartón) -->
  <polygon points="148,148 1052,148 1052,168 148,168" fill="#6a3410" opacity="0.90"/>

  <!-- ══ TECHO INTERIOR (pared superior dentro de la caja) ══════════ -->
  <polygon points="148,148 1052,148 1030,188 170,188" fill="url(#gti)" opacity="0.80"/>

  <!-- ══ PARED TRASERA / INTERIOR (donde va el contenido) ══════════ -->
  <rect x="148" y="168" width="904" height="544" fill="url(#gbg)"/>
  <rect x="148" y="168" width="904" height="544" fill="url(#cv)" opacity="0.30"/>
  <rect x="148" y="168" width="904" height="544" fill="url(#shadow)"/>

  <!-- ══ PISO INTERIOR ═══════════════════════════════════════════════ -->
  <polygon points="148,712 1052,712 1030,742 170,742" fill="url(#gfi)" opacity="0.85"/>

  <!-- ══ TAPA INFERIOR / FRONTAL (cuelga hacia adelante) ═══════════ -->
  <polygon points="0,860 1200,860 1052,712 148,712" fill="url(#gb)"/>
  <polygon points="0,860 1200,860 1052,712 148,712" fill="url(#cv)" opacity="0.45"/>

  <!-- Borde corrugado inferior -->
  <polygon points="148,712 1052,712 1052,692 148,692" fill="#6a3410" opacity="0.75"/>

  <!-- ══ LÍNEAS DE PLIEGUE / BORDES ═════════════════════════════════ -->
  <!-- Esquinas -->
  <line x1="148" y1="148" x2="0"    y2="0"   stroke="#5a2a08" stroke-width="1.5" opacity="0.80"/>
  <line x1="1052" y1="148" x2="1200" y2="0"   stroke="#5a2a08" stroke-width="1.5" opacity="0.80"/>
  <line x1="148" y1="712" x2="0"    y2="860"  stroke="#5a2a08" stroke-width="1.5" opacity="0.80"/>
  <line x1="1052" y1="712" x2="1200" y2="860"  stroke="#5a2a08" stroke-width="1.5" opacity="0.80"/>

  <!-- Marco de la apertura -->
  <rect x="148" y="148" width="904" height="564"
        fill="none" stroke="#7a3a10" stroke-width="2" opacity="0.85"/>
</svg>
